<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cachito San Juan XXIII</title>
</head>
<body>
  <script>
    const path = window.location.pathname.replace(/\/$/, "");
    const route = path.split("/").pop() || "login";
    const base = path.slice(0, Math.max(0, path.length - route.length)).replace(/\/$/, "");
    window.location.replace(`${base}/index.html?route=${encodeURIComponent(route)}`);
  </script>
</body>
</html>
